name: Build JAR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'

      - name: Build
        run: gradle build

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: christmasland-jar
          path: build/libs/*.jar
          if-no-files-found: error
